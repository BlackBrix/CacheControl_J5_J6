PLG_SYSTEM_CACHECONTROL="System - Cache Control"
PLG_SYSTEM_CACHECONTROL_XML_DESCRIPTION="Disables Joomla's normal caching for selected requests according to routed URL parameters."
PLG_SYSTEM_CACHECONTROL_CONFIG_DEFINITIONS_LABEL="Exclusion rules"
PLG_SYSTEM_CACHECONTROL_CONFIG_DEFINITIONS_DESCRIPTION="One URL-parameter rule per line, e.g. option=com_content&amp;view=article&amp;id=1689 or Itemid=2088. All parameters in a rule must match. Use ? for any existing value. Empty lines and lines starting with # or ; are ignored."
PLG_SYSTEM_CACHECONTROL_CONFIG_REENABLE_AFTERDISPATCH_LABEL="Re-enable caching after component dispatch"
PLG_SYSTEM_CACHECONTROL_CONFIG_REENABLE_AFTERDISPATCH_DESCRIPTION="No (recommended for fully uncached excluded requests): caching stays disabled for the remainder of the request. Yes: restore the previous cache setting after the main component is rendered; later parts such as modules may be cached. Does not control the separate System - Page Cache plugin. Existing saved values are preserved on update."
PLG_SYSTEM_CACHECONTROL_CONFIG_DEBUG_LABEL="Diagnostic logging"
PLG_SYSTEM_CACHECONTROL_CONFIG_DEBUG_DESCRIPTION="Log rule matches and caching changes to administrator/logs/plg_system_cachecontrol.php (or the configured Joomla log directory). Logs are written ONLY if both this option and Joomla's global Debug System are enabled. Disable after testing."
