PLG_SYSTEM_CACHECONTROL="System – Cache Control"
PLG_SYSTEM_CACHECONTROL_XML_DESCRIPTION="Deaktiviert das normale Joomla-Caching für ausgewählte Aufrufe anhand der von Joomla ermittelten URL-Parameter."
PLG_SYSTEM_CACHECONTROL_CONFIG_DEFINITIONS_LABEL="Cache-Ausschlussregeln"
PLG_SYSTEM_CACHECONTROL_CONFIG_DEFINITIONS_DESCRIPTION="Eine Regel pro Zeile, z. B. option=com_content&amp;view=article&amp;id=1689 oder Itemid=2088. Alle Parameter einer Regel müssen übereinstimmen. ? steht für einen beliebigen vorhandenen Wert. Leerzeilen und Zeilen beginnend mit # oder ; werden ignoriert."
PLG_SYSTEM_CACHECONTROL_CONFIG_REENABLE_AFTERDISPATCH_LABEL="Caching nach Verarbeitung der Komponente wieder aktivieren"
PLG_SYSTEM_CACHECONTROL_CONFIG_REENABLE_AFTERDISPATCH_DESCRIPTION="Nein (empfohlen, wenn für die ausgeschlossenen Aufrufe das normale Caching durchgehend aus bleiben soll): Der Cache bleibt während des restlichen Aufrufs deaktiviert. Ja: Nach dem Rendern der Hauptkomponente wird die vorherige Cache-Einstellung wiederhergestellt; später gerenderte Bereiche wie Module können dann wieder gecacht werden. Das separate Plugin System – Seitencache wird dadurch nicht gesteuert. Gespeicherte Einstellungen bleiben bei Updates erhalten."
PLG_SYSTEM_CACHECONTROL_CONFIG_DEBUG_LABEL="Diagnose-Protokollierung"
PLG_SYSTEM_CACHECONTROL_CONFIG_DEBUG_DESCRIPTION="Protokolliert Regel-Treffer und Cache-Umschaltungen in plg_system_cachecontrol.php im Joomla-Protokollverzeichnis. Es wird NUR protokolliert, wenn diese Option und zugleich Joomla „System debuggen“ aktiviert sind. Nach Tests wieder deaktivieren."
